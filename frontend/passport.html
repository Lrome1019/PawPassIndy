<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Pet Passport · PawPass Indy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/api.js"></script>
</head>
<body>
<main class="page">
  <!-- "My pets" list (Task 3) will go here -->
  <section id="mypets"></section>

  <form id="form" class="stack">
    <h1>Create a pet passport</h1>
    <p class="muted small">One profile per pet. Fields marked * are required.</p>
    <input class="field" name="name" placeholder="Name *" required>
    <input class="field" name="previous_names" placeholder="Previous names (comma-separated)">
    <div class="two">
      <select class="field" name="species" required><option value="">Species *</option><option>dog</option><option>cat</option><option>other</option></select>
      <select class="field" name="size"><option value="">Size</option><option>small</option><option>medium</option><option>large</option></select>
    </div>
    <div class="two">
      <input class="field" name="breed" placeholder="Breed">
      <input class="field" name="color" placeholder="Color">
    </div>
    <input class="field" name="markings" placeholder="Identifying features">
    <input class="field" name="photo_url" placeholder="Photo URL">
    <input class="field" name="microchip_number" placeholder="Microchip number" inputmode="numeric">
    <input class="field" name="chip_registry" placeholder="Chip registry">
    <input class="field" name="adoption_shelter" placeholder="Adoption shelter">
    <div class="two">
      <input class="field" type="date" name="adoption_date" aria-label="Adoption date">
      <input class="field" name="adoption_id" placeholder="Adoption ID">
    </div>
    <h2 class="section-title">Owner <span class="muted small" style="font-family:var(--font-body);font-weight:400">(never shown publicly)</span></h2>
    <input class="field" name="owner_name" placeholder="Your name">
    <input class="field" name="owner_phone" type="tel" placeholder="Phone">
    <input class="field" name="owner_email" type="email" placeholder="Email">
    <button class="btn btn-big" id="submit">Create passport</button>
    <p id="err" class="err"></p>
  </form>

  <section id="done" class="stack center" hidden>
    <h1><span id="petname"></span> has a passport.</h1>
    <div id="qr" class="card"></div>
    <div class="card" style="text-align:left">
      <p class="small muted" style="margin:0 0 4px">Write this URL to your NFC tag:</p>
      <p id="taglink" class="mono" style="margin:0"></p>
    </div>
    <a id="petlink" class="btn">Open owner page</a>
    <a id="taglinkbtn" class="btn btn-alt">Preview tag page</a>
  </section>
</main>
<script>
renderNav("New Pet");
// Mock mode has no /t/ route (static server), so use tag.html?code=
const tagPath = code => USE_MOCK ? `/tag.html?code=${code}` : `/t/${code}`;

// Reads the saved list of pets from this browser (or [] if none / storage unavailable)
function getMyPets() {
  try {
    const saved = localStorage.getItem("pawpass_my_pets");
    return JSON.parse(saved || "[]");
  } catch (e) {
    return [];
  }
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  $("#submit").disabled = true; $("#err").textContent = "";
  const body = Object.fromEntries(new FormData(e.target).entries());
  try {
    const pet = await api.createPet(body);
    const url = location.origin + tagPath(pet.tag_code);
    $("#petname").textContent = pet.name;
    $("#taglink").textContent = url;
    $("#taglinkbtn").href = tagPath(pet.tag_code);
    $("#petlink").href = `/pet.html?id=${pet.id}`;
    const qr = api.qrUrl(pet.id);
    $("#qr").innerHTML = qr
      ? `<img src="${qr}" alt="QR code" class="qr-img">`
      : `<div class="muted" style="padding:24px">QR code appears here once the backend is connected.<br>(Mock mode)</div>`;
    $("#form").hidden = true; $("#done").hidden = false;
  } catch (err) {
    $("#err").textContent = "Couldn't save: " + err.message;
    $("#submit").disabled = false;
  }
});
</script>
</body>
</html>

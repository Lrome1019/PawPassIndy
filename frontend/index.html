<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawPass Indy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/api.js"></script>
</head>
<body class="text-gray-900">
<main class="max-w-2xl mx-auto p-3 space-y-3">
  <div id="map" class="w-full rounded-xl" style="height:50vh"></div>
  <div class="flex gap-4 text-sm px-1">
    <span><span class="inline-block pin pin-lost align-middle"></span> Lost pet</span>
    <span><span class="inline-block pin pin-sight align-middle"></span> Sighting</span>
    <span id="updated" class="ml-auto text-gray-500"></span>
  </div>
  <h2 class="font-bold text-lg">Lost pets</h2>
  <div id="lost" class="space-y-2"></div>
  <h2 class="font-bold text-lg">Recent sightings</h2>
  <div id="sightings" class="space-y-2"></div>
</main>
<script>
renderNav("Map");
const map = L.map("map").setView([39.7684, -86.1581], 10);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);
const icon = cls => L.divIcon({ className: "", html: `<div class="pin ${cls}"></div>`, iconSize: [18, 18] });
let fitted = false;

async function refresh() {
  try {
    const feed = await api.getFeed();
    layer.clearLayers();
    const pts = [];
    feed.lost_pets.forEach(p => {
      if (p.last_seen_lat == null) return;
      pts.push([p.last_seen_lat, p.last_seen_lng]);
      L.marker([p.last_seen_lat, p.last_seen_lng], { icon: icon("pin-lost") }).addTo(layer)
        .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.color)} ${esc(p.species)}<br>Lost ${p.last_seen_at ? ago(p.last_seen_at) : ""}`);
    });
    feed.sightings.forEach(s => {
      if (s.lat == null) return;
      pts.push([s.lat, s.lng]);
      L.marker([s.lat, s.lng], { icon: icon("pin-sight") }).addTo(layer)
        .bindPopup(`${esc(s.description)}<br><small>${ago(s.created_at)}</small>`);
    });
    if (!fitted && pts.length) { map.fitBounds(pts, { padding: [30, 30], maxZoom: 12 }); fitted = true; }
    $("#lost").innerHTML = feed.lost_pets.map(p => `
      <a href="/pet.html?id=${p.id}" class="card block min-h-[44px]">
        <b>${esc(p.name)}</b> <span class="text-gray-500">${esc(p.color)} ${esc(p.species)}</span>
        <div class="text-sm text-gray-600">${esc(p.lost_notes)}</div></a>`).join("") || '<p class="text-gray-500">No lost pets.</p>';
    $("#sightings").innerHTML = feed.sightings.slice().reverse().map(s => `
      <div class="card"><div>${esc(s.description)}</div>
      <div class="text-sm text-gray-500">${ago(s.created_at)}${s.reporter_name ? " · " + esc(s.reporter_name) : ""}</div></div>`).join("") || '<p class="text-gray-500">No sightings yet.</p>';
    $("#updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { $("#updated").textContent = "Offline, retrying…"; }
}
refresh();
setInterval(refresh, 5000); // live updates every 5s
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Found a pet? · PawPass Indy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/api.js"></script>
</head>
<body>
<main class="page stack" id="main"><p class="muted">Loading…</p></main>
<script>
renderNav("");
// Code comes from /t/{code} (backend) or ?code= (mock/static)
const code = new URLSearchParams(location.search).get("code") || location.pathname.split("/").filter(Boolean).pop();
const row = (k, v) => v ? `<div class="row"><dt>${k}</dt><dd>${esc(v)}</dd></div>` : "";

api.getTag(code).then(p => {
  $("#main").innerHTML = `
    <article class="flyer ${p.is_lost ? "lost" : ""}">
      <p class="flyer-kicker">${p.is_lost ? "Lost pet" : "Pet passport"}</p>
      <h1 class="flyer-title">${p.is_lost ? "Have you seen me?" : "Found this pet?"}</h1>
      ${p.photo_url
        ? `<img src="${esc(p.photo_url)}" alt="Photo of ${esc(p.name)}" class="flyer-photo">`
        : '<div class="flyer-nophoto">No photo yet</div>'}
      <p class="flyer-name">${esc(p.name)}</p>
      <dl class="rows">
        ${row("Species", p.species)}${row("Breed", p.breed)}${row("Color", p.color)}${row("Size", p.size)}
        ${row("Features", p.markings)}${row("Also answers to", p.previous_names)}
      </dl>
    </article>
    <a href="/report.html?pet_id=${p.id}" class="btn btn-big" style="margin-top:20px">Report a sighting</a>
    <p class="fineprint">Owner contact details are kept private.<br>Your location is shared only if you tap "Use my location."</p>`;
}).catch(() => { $("#main").innerHTML = '<p class="card err">Sorry, we couldn\'t find that tag.</p>'; });
</script>
</body>
</html>
